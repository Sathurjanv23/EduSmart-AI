name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks secret detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review (PR diffs)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Dependency Review Action
        uses: actions/dependency-review-action@v4
        continue-on-error: true
        with:
          fail-on-severity: critical
          comment-summary-in-pr: false

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npx tsc --noEmit
      - name: Unit and service tests
        run: npm run test --if-present
        env:
          CI: "true"
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080/api
      - name: npm dependency vulnerability audit
        run: |
          echo "Running npm audit on production dependencies..."
          npm audit --omit=dev --audit-level=high || true
      - name: Evaluate critical npm vulnerabilities
        run: |
          npm audit --omit=dev --audit-level=critical

  backend:
    name: Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Non-production values used only while constructing the Spring test context.
      JWT_SECRET: ci-only-secret-replace-me-32-characters-minimum
      MONGODB_URI: mongodb://localhost:27017/sms_ci_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: chmod +x mvnw
      - name: Test
        run: ./mvnw -B test
      - name: Package
        run: ./mvnw -B -DskipTests clean package
      - name: Maven Dependency Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "backend"
          format: "table"
          severity: "CRITICAL"
          exit-code: "1"
          trivyignores: ".trivyignore"

  ml-service:
    name: ML service
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ml-service/requirements.txt
            ml-service/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Python dependency vulnerability check
        run: |
          pip-audit --requirement requirements.txt
      - name: Test
        run: pytest
      - name: Train reproducible synthetic demo model
        run: >-
          python -m app.training
          --samples 3000
          --seed 42
          --output artifacts/student_risk_pipeline.joblib
          --metrics-output artifacts/training_metrics.json
      - name: Prediction smoke test
        run: >-
          python -m app.predict_cli
          --model artifacts/student_risk_pipeline.joblib
          --attendance 88
          --marks 74
          --completion 90
          --trend 3
          --missed 1

  docker:
    name: Docker configuration and builds
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [security-secrets, frontend, backend, ml-service]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Build application images
        run: docker compose --env-file .env.example build --pull
