# ==============================================================================
# CampusCore Backend - Production Profile Configuration
# Activated via SPRING_PROFILES_ACTIVE=prod
# ==============================================================================

# Cookie Security - strictly HTTPS enforced in production
security.cookie.secure=true
security.cookie.same-site=Lax

# Actuator Health Probes - Kubernetes and Container Orchestration
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoints.web.exposure.include=health,info

# Error Responses - Zero leakage of stack traces, binding errors, or internal messages
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Production Seed Protection - Guaranteed false
app.seed.demo-data=false

# Production Mail STARTTLS Enforcement
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Structured Console Logging with Correlation IDs
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{correlationId:-none}] - %msg%n
