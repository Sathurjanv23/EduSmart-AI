spring.application.name=sms-backend
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]
server.port=${SERVER_PORT:8080}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/smsdb}
spring.data.mongodb.auto-index-creation=true

# Mail/OTP configuration. Production credentials must only be supplied as environment variables.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
app.mail.from=${MAIL_FROM:no-reply@campuscore.local}
spring.mail.protocol=${MAIL_PROTOCOL:smtp}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT_MS:5000}

# Authentication and browser origin settings.
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
security.cookie.name=${COOKIE_NAME:sms_session}
security.cookie.secure=${COOKIE_SECURE:false}
security.cookie.same-site=${COOKIE_SAME_SITE:Lax}
security.cookie.domain=${COOKIE_DOMAIN:}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${app.frontend-url}}
app.auth.otp-expiry-seconds=${OTP_EXPIRY_SECONDS:300}
app.auth.otp-max-attempts=${OTP_MAX_ATTEMPTS:5}
app.auth.reset-token-expiry-minutes=${RESET_TOKEN_EXPIRY_MINUTES:15}
app.auth.rate-limit-window-seconds=${AUTH_RATE_LIMIT_WINDOW_SECONDS:900}
app.auth.login-rate-limit=${LOGIN_RATE_LIMIT:10}
app.auth.otp-rate-limit=${OTP_RATE_LIMIT:10}
app.auth.password-reset-rate-limit=${PASSWORD_RESET_RATE_LIMIT:5}

# Uploads and downstream ML service.
file.upload.dir=${UPLOAD_DIR:./uploads}
file.upload.max-size=${UPLOAD_MAX_BYTES:10485760}
file.upload.max-files-per-request=${UPLOAD_MAX_FILES:10}
file.upload.allowed-extensions=${UPLOAD_ALLOWED_EXTENSIONS:pdf,png,jpg,jpeg,doc,docx,txt}
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_BYTES:10485760}
spring.servlet.multipart.max-request-size=${UPLOAD_REQUEST_MAX_BYTES:20971520}
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}
app.fees.currency=${FEE_CURRENCY:LKR}
app.seed.demo-data=${APP_SEED_DEMO_DATA:false}
app.seed.demo-password=${DEMO_PASSWORD:DemoOnly!234}

# Only health/info are exposed; security permits these two endpoints explicitly.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.sms.backend=${APP_LOG_LEVEL:INFO}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{correlationId:-none}] - %msg%n

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
